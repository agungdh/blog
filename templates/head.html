{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{.Title}}</title>
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark')
            }
        })()
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css" rel="stylesheet">
    <link href="/static/css/style.{{.AssetHashes.CSS}}.css" rel="stylesheet">
</head>
<body>
<nav class="navbar is-transparent" role="navigation" aria-label="main navigation">
    <div class="container">
        <div class="navbar-brand">
            <a class="navbar-item is-size-5 has-text-weight-bold" href="/">
                <span style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">My Blog</span>
            </a>
        </div>
        <div class="navbar-end" x-data="{ dark: document.documentElement.getAttribute('data-theme') === 'dark' }">
            <div class="navbar-item">
                <button class="button is-small is-light is-rounded" @click="dark = !dark; localStorage.setItem('theme', dark ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', dark ? 'dark' : '')"
                    :title="dark ? 'Switch to light mode' : 'Switch to dark mode'">
                    <span x-text="dark ? '\u263E' : '\u2600'"></span>
                </button>
            </div>
        </div>
    </div>
</nav>
<main class="container px-4 py-4">
{{end}}
