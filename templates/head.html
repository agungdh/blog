{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.className='dark'}})()
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <nav>
            <a href="/" class="logo">My Blog</a>
            <div class="nav-links">
                <a href="/">Home</a>

                <button id="theme-toggle" aria-label="Toggle theme"></button>
            </div>
        </nav>
    </header>
    <main class="container">
{{end}}
