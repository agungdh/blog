name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goos: linux
            binary: blog-linux-amd64
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            binary: blog-linux-arm64
          - os: ubuntu-latest
            arch: amd64
            goos: windows
            binary: blog-windows-amd64.exe
          - os: ubuntu-latest
            arch: arm64
            goos: windows
            binary: blog-windows-arm64.exe
          - os: ubuntu-latest
            arch: amd64
            goos: darwin
            binary: blog-darwin-amd64
          - os: ubuntu-latest
            arch: arm64
            goos: darwin
            binary: blog-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: |
          go build -ldflags="-s -w \
            -X 'blog/internal/version.Commit=${{ github.sha }}' \
            -X 'blog/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts from build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          RUN_ID=$(gh run list \
            --workflow build.yml \
            --commit "${{ github.sha }}" \
            --limit 10 \
            --json databaseId,event,status,conclusion \
            -q '[.[] | select(.event=="push" and .conclusion=="success") | .databaseId] | first')
          if [ -z "$RUN_ID" ]; then
            echo "no successful build run found for this commit"
            exit 1
          fi
          echo "downloading artifacts from run $RUN_ID"
          gh run download "$RUN_ID" --dir dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(find dist -type f -name 'blog-*'); do chmod +x "$f"; done
          gh release upload "${{ github.ref_name }}" $(find dist -type f -name 'blog-*') --clobber
