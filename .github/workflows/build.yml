name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goos: linux
            binary: blog-linux-amd64

          - os: ubuntu-24.04-arm
            arch: arm64
            goos: linux
            binary: blog-linux-arm64

          - os: windows-latest
            arch: amd64
            goos: windows
            binary: blog-windows-amd64.exe

          - os: macos-latest
            arch: amd64
            goos: darwin
            binary: blog-darwin-amd64

          - os: macos-latest
            arch: arm64
            goos: darwin
            binary: blog-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/blog-linux-* dist/blog-darwin-*
          gh release upload "${{ github.ref_name }}" dist/* --clobber
