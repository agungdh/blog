name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-s -w" -o blog .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: blog-linux-amd64
          path: blog
